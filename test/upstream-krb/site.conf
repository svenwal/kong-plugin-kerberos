# A Kerberos protected upstream, used to prove that Kong can authenticate
# onwards with either the caller's delegated credential or its own identity.
ServerName secure.example.test

<VirtualHost *:80>
    ScriptAlias / /usr/lib/cgi-bin/whoami

    <Location />
        AuthType GSSAPI
        AuthName "Kerberos protected upstream"
        GssapiCredStore keytab:/keytabs/secure.keytab
        # Keep the full principal so the tests can tell alice from kong-client.
        GssapiLocalName Off
        GssapiAllowedMech krb5
        Require valid-user
    </Location>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
