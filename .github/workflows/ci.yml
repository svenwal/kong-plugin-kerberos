name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Run luacheck via `docker run` rather than as a job-level `container:`.
      # The image is built on an Alpine whose musl predates pthread_getname_np,
      # so the runner's Node binary cannot execute inside it and every
      # javascript action (including actions/checkout) fails to start.
      - name: Run luacheck
        run: docker run --rm -v "$PWD:/work" -w /work ghcr.io/lunarmodules/luacheck:latest kong/

  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kong_image:
          - kong/kong-gateway:3.14
          - kong/kong:3.9
    steps:
      - uses: actions/checkout@v4

      - name: Run the end to end suite
        env:
          KONG_IMAGE: ${{ matrix.kong_image }}
        run: |
          docker compose -f test/docker-compose.yml build
          docker compose -f test/docker-compose.yml up -d kdc upstream upstream-krb kong
          docker compose -f test/docker-compose.yml run --rm client

      - name: Kong logs on failure
        if: failure()
        run: docker compose -f test/docker-compose.yml logs kong

      - name: Tear down
        if: always()
        run: docker compose -f test/docker-compose.yml down -v
